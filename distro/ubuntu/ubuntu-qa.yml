name: Ubuntu QA

on:
  push:
    branches:
      - main
    paths:
      - 'code/**'
      - 'Makefile'
      - 'VERSION'
      - 'rayicons.h'
      - '.github/workflows/ubuntu-qa.yml'

  pull_request:

  workflow_dispatch:

jobs:
  build:
    name: Build on Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-${{ matrix.ubuntu }}

    strategy:
      fail-fast: false
      matrix:
        ubuntu:
          - '22.04'
          - '24.04'

    steps:

      # ==========================================
      # Checkout
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # System information
      # ==========================================

      - name: System information
        run: |
          echo "=== Ubuntu ==="
          cat /etc/os-release

          echo
          echo "=== Kernel ==="
          uname -a

          echo
          echo "=== Compiler ==="
          g++ --version

      # ==========================================
      # Dependencies
      # ==========================================

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libraylib-dev \
            libarchive-dev \
            libmagic-dev \
            libvips-dev \
            libssl-dev \
            zlib1g-dev \
            libx11-dev \
            xdg-utils \
            p7zip-full \
            zstd \
            xz-utils

      # ==========================================
      # Verify pkg-config dependencies
      # ==========================================

      - name: Verify dependencies
        run: |
          set -e

          for pkg in \
            raylib \
            libarchive \
            libmagic \
            vips \
            openssl \
            zlib
          do
            echo "Checking $pkg..."
            pkg-config --modversion "$pkg"
          done

      # ==========================================
      # Build
      # ==========================================

      - name: Build RayMothFM
        run: |
          make clean || true
          make -j"$(nproc)"

      # ==========================================
      # Basic binary checks
      # ==========================================

      - name: Check binary
        run: |
          set -e

          test -x ./raymothfm

          echo "=== File ==="
          file ./raymothfm

          echo
          echo "=== Version ==="
          ./raymothfm --help

      # ==========================================
      # Config generation test
      # ==========================================

      - name: Test config generation
        run: |
          set -e

          ./raymothfm --mkcfg

          test -f "$HOME/.config/raymothfm/config"

          echo "Config generated successfully:"
          cat "$HOME/.config/raymothfm/config"

      # ==========================================
      # Dynamic dependencies
      # ==========================================

      - name: Check linked libraries
        run: |
          set -e

          echo "=== ldd ==="
          ldd ./raymothfm

          echo
          echo "Checking for missing libraries..."

          if ldd ./raymothfm | grep -q "not found"; then
            echo "ERROR: Missing runtime libraries"
            exit 1
          fi

      # ==========================================
      # Archive tool checks
      # ==========================================

      - name: Check archive tools
        run: |
          set -e

          7z
          zstd --version
          xz --version

      # ==========================================
      # Artifact
      # ==========================================

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: raymothfm-ubuntu-${{ matrix.ubuntu }}
          path: |
            raymothfm
            VERSION
