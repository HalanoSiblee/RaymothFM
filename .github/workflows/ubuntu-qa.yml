name: Ubuntu QA

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libarchive-dev \
            libmagic-dev \
            libvips-dev \
            libssl-dev \
            zlib1g-dev \
            libx11-dev \
            libglfw3-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            xdg-utils \
            p7zip-full \
            zstd \
            xz-utils

      - name: Build Raylib
        run: |
          set -e

          git clone --depth 1 \
            https://github.com/raysan5/raylib.git \
            /tmp/raylib

          cmake \
            -S /tmp/raylib \
            -B /tmp/raylib/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_EXAMPLES=OFF

          cmake \
            --build /tmp/raylib/build \
            --parallel "$(nproc)"

          sudo cmake \
            --install /tmp/raylib/build

          sudo ldconfig

      - name: Verify Raylib
        run: |
          set -e
          pkg-config --exists raylib
          pkg-config --modversion raylib

      - name: Verify dependencies
        run: |
          set -e

          for pkg in \
            raylib \
            libarchive \
            libmagic \
            vips \
            openssl \
            zlib
          do
            echo "Checking $pkg..."
            pkg-config --exists "$pkg"
            pkg-config --modversion "$pkg"
          done

      - name: Build RayMothFM
        run: |
          set -e

          make clean || true
          make -j"$(nproc)"

      - name: Validate binary
        run: |
          set -e

          test -x ./raymothfm

          file ./raymothfm

          ./raymothfm --help

      - name: Test config generation
        run: |
          set -e

          ./raymothfm --mkcfg

          test -f "$HOME/.config/raymothfm/config"

      - name: Check runtime libraries
        run: |
          set -e

          ldd ./raymothfm

          if ldd ./raymothfm | grep -q "not found"; then
            echo "ERROR: Missing runtime libraries"
            exit 1
          fi

      - name: Test external tools
        run: |
          set -e

          7z -h >/dev/null
          zstd --version
          xz --version

      - name: Installation test
        run: |
          set -e

          sudo install \
            -Dm755 \
            ./raymothfm \
            /usr/local/bin/raymothfm

          command -v raymothfm
          raymothfm --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: raymothfm-ubuntu-22.04
          path: |
            raymothfm
            VERSION
